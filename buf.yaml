# From this directory, `buf build -o descriptor.bin` writes the FileDescriptorSet
# consumed by `go run ./cmd/proto-asyncapi` (defaults: descriptor.bin,
# events/proto/third_party/cloudevents/v1/spec.proto, and docs/asyncapi.yaml).
version: v2
modules:
  - path: events/proto
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
  ignore:
    - third_party
